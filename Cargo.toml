[package]
name        = "marcopolo"
version     = "0.4.0"
edition     = "2021"
description = "Scrape any URL, grab any file — one command. Async CLI tool for hunting and bulk-downloading PDFs, images, videos, source code, and more from GitHub repos and websites. Also: multi-source free-book search engine."
readme      = "README.md"
license     = "MIT OR Apache-2.0"
authors     = ["Marawan Yakout yakout@marawan.net"]
repository  = "https://github.com/MarawanYakout/MarcoPolo"
homepage    = "https://github.com/MarawanYakout/MarcoPolo"
keywords    = ["scraper", "downloader", "cli", "github", "crawler", "book-search"]
categories  = [
    "command-line-utilities",
    "web-programming",
    "network-programming",
]

[[bin]]
name = "marcopolo"
path = "src/main.rs"

[dependencies]
clap              = { version = "4",    features = ["derive"] }
colored           = "2"
console           = "0.15"  # key input + redraw for the checkbox picker (already used by indicatif)
futures           = "0.3"
indicatif         = "0.17"
percent-encoding  = "2"
regex             = "1"
reqwest           = { version = "0.12", features = ["json"] }
rustc-hash = "2.1.2"
scraper           = "0.21"
serde             = { version = "1",    features = ["derive"] }
serde_json        = "1"
tokio             = { version = "1",    features = ["full"] }
url               = "2"

[profile.release]
lto           = true   # whole-program optimisation: smaller, faster binary
codegen-units = 1
strip         = true
